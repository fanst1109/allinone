# GitHub Pages (Jekyll).
#
# Mục đích chính: KHÔNG phục vụ file README.md / markdown trực tiếp.
# Lý thuyết chỉ đọc qua nút "📖 Học Lý Thuyết" trong mỗi visualization.html
# (nội dung lấy từ README.data.js, không phải file .md thô).
#
# File .md vẫn nằm trong repo (là nguồn để tools/build-readme-data.go sinh
# README.data.js) nhưng không được copy vào site build → truy cập thẳng
# .../README.md sẽ trả 404 (và được 404.html chuyển hướng về viz/trang chính).
#
# Mọi .html trong repo đều KHÔNG có YAML front matter nên Jekyll copy nguyên
# trạng (không chạy qua Liquid) — output giống hệt khi tắt Jekyll, chỉ khác là
# markdown bị loại khỏi site.
exclude:
  - "*.md"
  - "**/*.md"
