<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Không tìm thấy trang</title>
<script>
// Chặn truy cập trực tiếp file README.md: chuyển hướng về nơi đọc lý thuyết đúng.
// - .../lesson-XX-.../README.md  → visualization.html cùng thư mục (có nút "📖 Học Lý Thuyết").
// - README.md cấp lĩnh vực/tier  → thư mục đó (phục vụ index.html).
(function () {
  var p = location.pathname;
  if (/README\.md$/i.test(p)) {
    if (/\/lesson-[^/]*\/README\.md$/i.test(p)) {
      location.replace(p.replace(/README\.md$/i, 'visualization.html') + location.hash);
    } else {
      location.replace(p.replace(/[^/]*README\.md$/i, '') + location.hash);
    }
  }
})();
</script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #14284a; color: #e2e8f0; line-height: 1.6; padding: 24px;
  }
  .box { max-width: 520px; text-align: center; }
  h1 { font-size: 72px; margin: 0; font-weight: 800; color: #4299e1; }
  h2 { font-size: 22px; margin: 8px 0 16px; font-weight: 700; color: #f0f4f8; }
  p { color: #a3c5e8; font-size: 15px; }
  a { color: #63b3ed; font-weight: 600; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <h2>Không tìm thấy trang</h2>
    <p>Trang bạn tìm không tồn tại. Lý thuyết mỗi bài đọc qua nút
       <strong>📖 Học Lý Thuyết</strong> ngay trong phần minh họa (visualization).</p>
    <p><a href="/index.html">← Về trang chính</a></p>
  </div>
</body>
</html>
