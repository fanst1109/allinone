<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <!-- nền: navy đậm + circle cùng tông fake chiều sâu (tránh gradient để render đồng nhất mọi engine) -->
  <rect width="1200" height="630" fill="#152e54"/>
  <circle cx="1120" cy="20" r="640" fill="#1d3a68"/>
  <circle cx="1180" cy="-40" r="420" fill="#254a80"/>
  <circle cx="1230" cy="-90" r="230" fill="#2f5a99"/>

  <!-- lưới chấm mờ -->
  <g fill="#ffffff" opacity="0.05">
    <circle cx="60" cy="560" r="3"/><circle cx="110" cy="560" r="3"/><circle cx="160" cy="560" r="3"/>
    <circle cx="60" cy="590" r="3"/><circle cx="110" cy="590" r="3"/><circle cx="160" cy="590" r="3"/>
    <circle cx="1140" cy="70" r="3"/><circle cx="1090" cy="70" r="3"/><circle cx="1040" cy="70" r="3"/>
    <circle cx="1140" cy="100" r="3"/><circle cx="1090" cy="100" r="3"/><circle cx="1040" cy="100" r="3"/>
  </g>

  <!-- huy hiệu mũ tốt nghiệp (từ favicon) -->
  <g transform="translate(80,74)">
    <rect width="150" height="150" rx="33" fill="#2c5282" stroke="#4299e1" stroke-width="2"/>
    <g transform="translate(75,75) scale(2.34) translate(-32,-32)">
      <path d="M32 16 L54 26 L32 36 L10 26 Z" fill="#ebf8ff"/>
      <path d="M32 36 L46 30 V41 C46 45 39 48 32 48 C25 48 18 45 18 41 V30 Z" fill="#a3c5e8"/>
      <path d="M54 26 V40" stroke="#ebf8ff" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="54" cy="42" r="3" fill="#f6ad55"/>
    </g>
  </g>

  <text x="252" y="128" font-size="30" font-weight="600" fill="#a3c5e8" letter-spacing="4">ALL·IN·ONE</text>
  <text x="252" y="188" font-size="34" font-weight="500" fill="#cbd5e0">31 lĩnh vực · tự học từ con số 0</text>

  <!-- tiêu đề -->
  <text x="80" y="330" font-size="100" font-weight="800" fill="#ffffff">From zero to hero</text>
  <text x="80" y="408" font-size="37" font-weight="400" fill="#cbd5e0">Hành trình ngàn dặm bắt đầu từ một bước chân.</text>

  <!-- pill lĩnh vực -->
  <g font-size="27" font-weight="700">
    <g transform="translate(80,486)">
      <rect width="150" height="52" rx="26" fill="#15803d"/><text x="75" y="35" text-anchor="middle" fill="#fff">Toán</text>
    </g>
    <g transform="translate(246,486)">
      <rect width="210" height="52" rx="26" fill="#00add8"/><text x="105" y="35" text-anchor="middle" fill="#062a33">Lập trình</text>
    </g>
    <g transform="translate(472,486)">
      <rect width="150" height="52" rx="26" fill="#0e7490"/><text x="75" y="35" text-anchor="middle" fill="#fff">AI/ML</text>
    </g>
    <g transform="translate(638,486)">
      <rect width="176" height="52" rx="26" fill="#1e40af"/><text x="88" y="35" text-anchor="middle" fill="#fff">Vật lý</text>
    </g>
    <g transform="translate(830,486)">
      <rect width="222" height="52" rx="26" fill="#b45309"/><text x="111" y="35" text-anchor="middle" fill="#fff">Tiếng Anh</text>
    </g>
    <g transform="translate(1068,486)">
      <rect width="52" height="52" rx="26" fill="#c05621"/><text x="26" y="35" text-anchor="middle" fill="#fff">+</text>
    </g>
  </g>

  <text x="80" y="592" font-size="26" font-weight="600" fill="#7f9cc0">learning.duytrinh.info.vn</text>
</svg>
